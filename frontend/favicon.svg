<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="flyGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Badge for Tab & Header Contrast -->
  <rect width="32" height="32" rx="7" fill="#070a12"/>
  <rect width="32" height="32" rx="7" stroke="rgba(0, 245, 212, 0.28)" stroke-width="1.2"/>

  <!-- Fly Wings: Delicate Neural Synaptic Mesh -->
  <path d="M16 13 C11 6, 4 6, 3 10 C2 14, 9 18, 16 17" fill="rgba(6, 182, 212, 0.14)" stroke="#06b6d4" stroke-width="0.9" stroke-linecap="round" opacity="0.9"/>
  <path d="M16 13 C21 6, 28 6, 29 10 C30 14, 23 18, 16 17" fill="rgba(6, 182, 212, 0.14)" stroke="#06b6d4" stroke-width="0.9" stroke-linecap="round" opacity="0.9"/>

  <!-- Sensory Antennae -->
  <path d="M14 7.5 C13 4.8, 11 3.8, 8.5 4.5" stroke="#00f5d4" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M18 7.5 C19 4.8, 21 3.8, 23.5 4.5" stroke="#00f5d4" stroke-width="1.1" stroke-linecap="round"/>

  <!-- Connectome Circuit Graph Edges -->
  <line x1="10.5" y1="9.5" x2="16" y2="12" stroke="url(#flyGlow)" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="21.5" y1="9.5" x2="16" y2="12" stroke="url(#flyGlow)" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="16" y1="12" x2="16" y2="19" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="19" x2="12" y2="24" stroke="#8b5cf6" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="16" y1="19" x2="20" y2="24" stroke="#8b5cf6" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="12" y1="24" x2="16" y2="27.5" stroke="#8b5cf6" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="20" y1="24" x2="16" y2="27.5" stroke="#8b5cf6" stroke-width="1.1" stroke-linecap="round"/>

  <!-- Compound Eyes (Optic Lobe Clusters) -->
  <circle cx="10.5" cy="9.5" r="2.2" fill="#00f5d4" filter="url(#neonGlow)"/>
  <circle cx="21.5" cy="9.5" r="2.2" fill="#00f5d4" filter="url(#neonGlow)"/>

  <!-- Central Complex / Brain Core -->
  <circle cx="16" cy="12" r="2.6" fill="#10b981" filter="url(#neonGlow)"/>
  <circle cx="16" cy="12" r="1.1" fill="#ffffff"/>

  <!-- Thoracic Motor Center -->
  <circle cx="16" cy="19" r="1.8" fill="#06b6d4"/>

  <!-- Abdominal Ganglia -->
  <circle cx="12" cy="24" r="1.3" fill="#8b5cf6"/>
  <circle cx="20" cy="24" r="1.3" fill="#8b5cf6"/>
  <circle cx="16" cy="27.5" r="1.4" fill="#8b5cf6"/>
</svg>
