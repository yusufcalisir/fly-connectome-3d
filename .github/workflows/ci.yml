name: CI – FlyConnectome 3D

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel any in-progress run for the same branch to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1 – Unit + Integration tests (no real connectome file needed)
  # ──────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run unit tests (excluding real-connectome & live-server tests)
        run: |
          uv run pytest tests/ \
            --ignore=tests/test_real_connectome_full.py \
            --ignore=tests/test_server_live.py \
            -v \
            --tb=short \
            --timeout=120 \
            -p no:warnings

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2 – LIF kernel performance regression
  # ──────────────────────────────────────────────────────────────────────────
  performance-regression:
    name: LIF Kernel Performance Regression
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run LIF vectorization performance tests
        run: |
          uv run pytest tests/test_lif_vectorization.py \
            -v \
            --tb=short \
            --timeout=60 \
            -p no:warnings

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3 – Real Janelia MaleCNS v1.0 connectome tests (runs only on main push)
  #         Uses a cached copy of the ~1GB .npz file stored as a GitHub secret
  #         or simply skips gracefully if data is absent.
  # ──────────────────────────────────────────────────────────────────────────
  real-connectome:
    name: Real Connectome Tests (166K neurons)
    runs-on: ubuntu-latest
    needs: unit-tests
    # Only run on direct pushes to main (not on PRs from forks – they can't access secrets)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Restore connectome data from cache
        id: cache-connectome
        uses: actions/cache@v4
        with:
          path: |
            data/malecns_v1/malecns_v1_graph.npz
            data/malecns_v1/circuits_manifest.json
          key: malecns-v1-connectome-${{ hashFiles('src/connectome_engine/data/downloader.py', 'src/connectome_engine/data/compile_malecns.py') }}

      - name: Download and compile connectome if not cached
        if: steps.cache-connectome.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          mkdir -p data/malecns_v1
          uv run python src/connectome_engine/data/downloader.py || true
          if [ -f "data/malecns_v1/edges.feather" ]; then
            uv run python src/connectome_engine/data/compile_malecns.py || true
          fi

      - name: Run real-connectome tests
        run: |
          uv run pytest \
            tests/test_real_connectome_full.py \
            tests/test_vnc_leg_circuits.py \
            tests/test_vnc_leg_biophysics.py \
            -v \
            --tb=short \
            --timeout=300 \
            -p no:warnings

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 4 – Server API + WebSocket integration tests
  # ──────────────────────────────────────────────────────────────────────────
  server-integration:
    name: Server API & WebSocket Integration
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run server & SNN regression tests (without real connectome)
        run: |
          uv run pytest \
            tests/test_server_live.py \
            tests/test_snn_performance_regression.py \
            -v \
            --tb=short \
            --timeout=120 \
            -p no:warnings

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 5 – Linting & type safety
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: |
          uv sync --dev
          uv pip install ruff

      - name: Ruff lint (src + tests)
        run: |
          uv run ruff check src/ tests/ --select=E,W,F,I --ignore=E501

      - name: Check pyproject.toml is valid
        run: |
          uv run python -c "import tomllib; tomllib.loads(open('pyproject.toml').read()); print('pyproject.toml OK')"
